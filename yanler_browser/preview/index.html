<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yanler UI 预览 — 交互原型</title>
<style>
/* ============ 字体（使用项目真实字体文件） ============ */
@font-face { font-family:'Outfit'; src:url('../assets/fonts/Outfit-ExtraLight.ttf') format('truetype'); font-weight:200; }
@font-face { font-family:'Outfit'; src:url('../assets/fonts/Outfit-Light.ttf') format('truetype'); font-weight:300; }
@font-face { font-family:'Outfit'; src:url('../assets/fonts/Outfit-Regular.ttf') format('truetype'); font-weight:400; }
@font-face { font-family:'Outfit'; src:url('../assets/fonts/Outfit-Medium.ttf') format('truetype'); font-weight:500; }
@font-face { font-family:'Outfit'; src:url('../assets/fonts/Outfit-SemiBold.ttf') format('truetype'); font-weight:600; }
@font-face { font-family:'Outfit'; src:url('../assets/fonts/Outfit-Bold.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'SourceHanSerifSC'; src:url('../assets/fonts/SourceHanSerifSC-Regular.otf') format('opentype'); font-weight:400; }

/* ============ 设计令牌 ============ */
:root {
  --radius:16px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
/* 浅色（默认，暖纸） */
html[data-theme="light"] {
  --bg0:#F6F4EF; --bg1:#ECE9E2;
  --paper:#FFFFFF;
  --surface:rgba(255,255,255,.55);
  --surface-strong:rgba(255,255,255,.72);
  --surface-soft:rgba(0,0,0,.045);
  --ink:#1A1B1E; --ink2:#6B6C72; --ink3:#A3A4AA;
  --line:rgba(0,0,0,.08);
  --accent:#3A5CCC; --accent-soft:rgba(58,92,204,.10);
  --danger:#C7453C; --ok:#2F9E63;
  --glass-blur:blur(20px) saturate(160%);
  --glass-hi:inset 0 .5px 0 rgba(255,255,255,.55);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --shadow-hover:0 2px 4px rgba(0,0,0,.05), 0 12px 28px rgba(0,0,0,.09);
  --card-border:rgba(0,0,0,.08);
  --sel-ink:#FFFFFF;
}
/* 深色（墨色，不发白） */
html[data-theme="dark"] {
  --bg0:#131417; --bg1:#191B1F;
  --paper:#1C1E22;
  --surface:rgba(28,30,35,.55);
  --surface-strong:rgba(32,34,40,.78);
  --surface-soft:rgba(255,255,255,.05);
  --ink:#E8E6E1; --ink2:#9C9DA5; --ink3:#63646C;
  --line:rgba(255,255,255,.09);
  --accent:#7B93F2; --accent-soft:rgba(123,147,242,.14);
  --danger:#E06056; --ok:#4CBB84;
  --glass-blur:blur(20px) saturate(140%) brightness(1.12);
  --glass-hi:inset 0 .5px 0 rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,0,0,.22), 0 8px 24px rgba(0,0,0,.30);
  --shadow-hover:0 2px 4px rgba(0,0,0,.30), 0 12px 28px rgba(0,0,0,.42);
  --card-border:rgba(255,255,255,.09);
  --sel-ink:#131417;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
::selection { background:var(--accent); color:var(--sel-ink); }
body {
  font-family:'Outfit','Microsoft YaHei',system-ui,sans-serif;
  background:#0F1013; color:var(--ink);
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:24px 16px 60px;
}
h1.page-title { color:#fff; font-weight:300; font-size:20px; letter-spacing:.5px; margin-bottom:6px; }
p.page-sub { color:#8A8B93; font-size:12px; margin-bottom:18px; }

/* 顶部控制条 */
.toolbar { display:flex; gap:8px; align-items:center; margin-bottom:22px; flex-wrap:wrap; justify-content:center; }
.toolbar button {
  font-family:inherit; font-size:12px; color:#D8D9DE; background:#1C1E23;
  border:1px solid #2E3138; border-radius:10px; padding:6px 14px; cursor:pointer;
  transition:all .15s var(--ease-out);
}
.toolbar button:hover { background:#262932; }
.toolbar button.active { background:var(--accent); border-color:transparent; color:#fff; }

/* ============ 设备框 ============ */
.stage { position:relative; }
#device {
  width:390px; height:800px;
  background:var(--bg0);
  border-radius:44px; overflow:hidden; position:relative;
  box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.07);
  transition:width .5s var(--ease-out), height .5s var(--ease-out);
  border:6px solid #26272D;
}
#device.desktop { width:960px; height:640px; border-radius:24px; }

/* 状态栏（模拟） */
.statusbar {
  height:30px; display:flex; justify-content:space-between; align-items:center;
  padding:0 22px; font-size:11px; color:var(--ink2); font-weight:500; letter-spacing:.3px;
}

/* 屏幕容器 */
.screen { position:absolute; inset:30px 0 0; display:none; flex-direction:column; }
.screen.active { display:flex; }

/* ============ 液态玻璃（减法版：无噪点、无渐变描边） ============ */
.glass {
  position:relative;
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow);
}
/* 顶部镜面高光 */
.glass::after {
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow:var(--glass-hi);
}
@supports not (backdrop-filter: blur(1px)) {
  .glass { background:var(--surface-strong); }
}
.glass > * { position:relative; z-index:1; }

/* 纸面卡片 */
.card {
  background:var(--paper);
  border:1px solid var(--card-border);
  border-radius:18px;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}

/* 按压反馈 */
.press { transition:transform .12s var(--ease-out); cursor:pointer; }
.press:active { transform:scale(.97); }
.press-icon { transition:transform .12s var(--ease-out); cursor:pointer; }
.press-icon:active { transform:scale(.92); }

/* 悬停抬升（仅精确指针设备） */
@media (hover:hover) and (pointer:fine) {
  .quick-tile .quick-avatar, .item, .tabcard, .menu-item .ic, .chip { transition:transform .2s var(--ease-out), box-shadow .2s var(--ease-out), background .2s var(--ease-out); }
  .quick-tile:hover .quick-avatar { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
  .item:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
  .tabcard:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
  .chip:hover { background:var(--surface-strong); }
}

/* ============ 新标签页 ============ */
#newtab {
  background:linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
  align-items:center; overflow-y:auto;
}
#newtab::-webkit-scrollbar { display:none; }
.nt-inner { width:100%; display:flex; flex-direction:column; align-items:center; padding:38px 32px 30px; }
.brand {
  font-family:'SourceHanSerifSC','Noto Serif SC','SimSun',serif;
  color:var(--ink);
  display:flex; flex-direction:column; align-items:center;
}
.brand .word { display:flex; align-items:baseline; }
.brand .Y { font-size:48px; font-weight:400; letter-spacing:-2px; line-height:1; }
.brand .rest { font-size:32px; font-weight:400; letter-spacing:3px; line-height:1; }
.brand .rule { width:44px; height:1px; background:var(--ink3); opacity:.55; margin-top:12px; }
/* 诗词区 */
.poem-area { height:112px; display:flex; align-items:center; justify-content:center; position:relative; width:100%; }
.poem-holder, .brand-holder {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  transition:opacity .5s var(--ease-out), transform .5s var(--ease-out);
}
.poem-holder { opacity:0; transform:translateY(6px); }
.poem-text {
  font-family:'SourceHanSerifSC','Noto Serif SC','SimSun',serif;
  font-size:17px; line-height:1.7; letter-spacing:1.5px; color:var(--ink);
  text-align:center; max-width:100%;
}
.poem-author {
  font-family:'SourceHanSerifSC','Noto Serif SC','SimSun',serif;
  font-size:11.5px; letter-spacing:2px; color:var(--ink2);
  text-align:center; margin-top:8px; opacity:0; transition:opacity .6s .2s;
}
.cursor { display:inline-block; width:2px; height:1em; margin-left:2px; vertical-align:-0.12em; background:var(--ink2); animation:cursorBreath 1.1s ease-in-out infinite; }
@keyframes cursorBreath { 0%,100% { opacity:.9; } 50% { opacity:.12; } }
/* 搜索框 */
.search-row { width:100%; max-width:480px; margin-top:26px; }
.search {
  border-radius:26px; height:50px; display:flex; align-items:center;
  padding:0 6px 0 16px; gap:10px;
}
.search .search-ic { width:17px; height:17px; color:var(--ink2); flex-shrink:0; }
.search input {
  flex:1; border:none; outline:none; background:transparent;
  font-family:inherit; font-size:14px; color:var(--ink); min-width:0;
}
.search input::placeholder { color:var(--ink3); }
.search .go {
  width:38px; height:38px; border:none; border-radius:19px; cursor:pointer;
  background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center;
  transition:transform .12s var(--ease-out), box-shadow .2s var(--ease-out);
}
.search .go:active { transform:scale(.92); }
.search .go svg { width:18px; height:18px; }
/* 快捷链接 */
.quick-section { margin-top:36px; width:100%; max-width:420px; }
.quick-label { font-size:11px; letter-spacing:2px; color:var(--ink3); text-align:center; margin-bottom:16px; }
.quick-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px 8px; }
.quick-tile { display:flex; flex-direction:column; align-items:center; gap:7px; }
.quick-avatar {
  width:48px; height:48px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:var(--paper); border:1px solid var(--card-border);
  color:var(--ink); font-size:19px; font-weight:500; font-family:'Outfit';
  box-shadow:0 1px 2px rgba(0,0,0,.04); position:relative;
}
.quick-avatar .x {
  position:absolute; top:-5px; right:-5px; width:18px; height:18px; border-radius:50%;
  background:var(--danger); color:#fff; font-size:10px; display:none; align-items:center; justify-content:center;
}
.quick-tile:hover .x { display:flex; }
.quick-name { font-size:11.5px; color:var(--ink2); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.quick-add { background:transparent; border:1px dashed var(--card-border); color:var(--ink2); }
.quick-add svg { width:20px; height:20px; }

/* ============ 页面（模拟网页） ============ */
#page { background:var(--bg1); }
.address-row { padding:8px 12px 4px; }
.address {
  border-radius:24px; height:44px; display:flex; align-items:center; padding:0 6px 0 14px; gap:8px;
}
.address .lock { width:15px; height:15px; color:var(--accent); flex-shrink:0; }
.address input {
  flex:1; border:none; outline:none; background:transparent;
  font-family:inherit; font-size:13px; color:var(--ink); min-width:0;
}
.address button {
  width:38px; height:38px; border:none; background:transparent; cursor:pointer;
  color:var(--ink2); border-radius:19px; display:flex; align-items:center; justify-content:center;
}
.address button svg { width:18px; height:18px; }
.progress { height:2px; margin:2px 12px 0; border-radius:2px; overflow:hidden; background:transparent; }
.progress i {
  display:block; height:100%; width:100%;
  background:var(--accent);
  transform:scaleX(0); transform-origin:0 50%;
  transition:transform .18s linear, opacity .3s ease;
}
.fake-page { flex:1; overflow-y:auto; padding:22px 20px; }
.fake-page h2 { font-size:17px; margin-bottom:4px; color:var(--ink); font-weight:600; }
.fake-page p { font-size:13px; line-height:1.8; color:var(--ink2); margin-top:12px; }
.fake-page .sitebar {
  height:110px; border-radius:14px; margin-bottom:14px; display:flex; align-items:flex-end; padding:12px;
  background:var(--surface-soft); border:1px solid var(--card-border);
}
.fake-page .sitebar small { opacity:.75; font-weight:300; color:var(--ink2); }
.card-blocks { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
.card-blocks div { height:64px; border-radius:12px; background:var(--paper); border:1px solid var(--card-border); }
.card-blocks div:nth-child(2) { background:var(--surface-soft); }

/* ============ 底部栏（布局不变） ============ */
#bottombar {
  position:absolute; left:0; right:0; bottom:0; z-index:20;
  border-radius:0;
}
#bottombar .bar-inner {
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  height:58px;
}
.navbtn {
  width:40px; height:40px; border-radius:20px; border:none; background:transparent;
  color:var(--ink); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.navbtn svg { width:20px; height:20px; }
.navbtn:disabled { color:var(--ink3); opacity:.35; }
.ai-btn {
  width:48px; height:48px; border-radius:24px; border:none;
  background:linear-gradient(135deg,#3A5CCC,#2F9E8F);
  color:#fff; cursor:pointer; position:relative;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(58,92,204,.28);
}
html[data-theme="dark"] .ai-btn { background:linear-gradient(135deg,#5D7BE8,#3BAE9C); }
.ai-btn svg { width:20px; height:20px; }
.ai-btn .dot {
  position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%;
  background:var(--ok); box-shadow:0 0 4px var(--ok);
}
.tabbtn {
  width:40px; height:40px; border:none; background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.tabbtn .frame {
  width:24px; height:24px; border:1.5px solid var(--ink2); border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:var(--ink2);
}

/* ============ 底部面板（标签页/菜单/壁纸） ============ */
.sheet-mask {
  position:absolute; inset:0; background:rgba(0,0,0,.40); z-index:30;
  display:flex; align-items:flex-end;
  visibility:hidden; pointer-events:none;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  transition:opacity .2s ease, visibility 0s .3s;
  opacity:0;
}
.sheet-mask.show { opacity:1; visibility:visible; pointer-events:auto; transition:opacity .2s ease; }
.sheet {
  width:100%; border-radius:28px 28px 0 0; padding:0 12px calc(20px + env(safe-area-inset-bottom));
  max-height:78%; overflow-y:auto;
  transform:translateY(102%);
  transition:transform .28s cubic-bezier(.55,.06,.35,.95);
  touch-action:none;
}
.sheet-mask.show .sheet { transform:none; transition:transform .45s var(--ease-drawer); }
.sheet-grab {
  width:100%; height:24px; display:flex; align-items:center; justify-content:center;
  cursor:grab; position:relative; touch-action:none;
}
.sheet-grab::before {
  content:''; width:40px; height:4px; border-radius:2px; background:var(--ink3); opacity:.4;
}
.sheet-head { display:flex; justify-content:space-between; align-items:center; padding:6px 10px 12px; }
.sheet-head h3 { font-size:16px; font-weight:600; letter-spacing:-.2px; }
.sheet-head .actions { display:flex; gap:6px; }
.chip {
  font-family:inherit; font-size:12px; border:1px solid var(--card-border);
  background:var(--surface-soft); color:var(--ink); border-radius:9px; padding:5px 10px; cursor:pointer;
  transition:background .15s var(--ease-out);
}
.chip:active { transform:scale(.96); }
/* 标签卡片 */
.tabgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:4px 6px; }
.tabcard { border-radius:18px; padding:8px; display:flex; flex-direction:column; gap:6px; }
.tabcard .thumb {
  height:110px; border-radius:12px; background:var(--surface-soft);
  border:1px solid var(--card-border);
  display:flex; align-items:center; justify-content:center;
}
.tabcard .thumb .letter {
  width:44px; height:44px; border-radius:14px;
  background:var(--paper); border:1px solid var(--card-border);
  color:var(--ink); font-size:18px; font-weight:500; font-family:'Outfit';
  display:flex; align-items:center; justify-content:center;
}
.tabcard.active { outline:1.5px solid var(--accent); outline-offset:-1px; }
.tabcard .ttl { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--ink); padding:2px 4px 4px; }
.tabcard .ttl span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tabcard .ttl button { border:none; background:transparent; color:var(--ink2); cursor:pointer; display:flex; padding:4px; }
.tabcard .ttl button svg { width:13px; height:13px; }
/* 菜单 */
.menu-stats {
  margin:0 6px 14px; border-radius:10px; padding:8px 12px; font-size:12px;
  background:var(--surface-soft); border:1px solid var(--card-border);
  display:flex; justify-content:space-between; color:var(--ink2);
}
.menu-stats b { color:var(--accent); font-weight:600; }
.menu-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px 8px; padding:0 6px; }
.menu-item { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; color:var(--ink2); }
.menu-item .ic {
  width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:var(--surface-soft); border:1px solid var(--card-border);
  color:var(--ink);
}
.menu-item .ic svg { width:22px; height:22px; }
/* 壁纸面板 */
.wp-title { margin:4px 8px 14px; font-size:15px; font-weight:600; letter-spacing:-.2px; }
.wp-grid { display:flex; flex-wrap:wrap; gap:14px 12px; padding:0 8px 8px; }
.wp-item { width:64px; text-align:center; }
.wp-swatch {
  width:64px; height:64px; border-radius:18px; border:2px solid transparent;
  transition:transform .2s var(--ease-out), box-shadow .2s var(--ease-out);
}
.wp-item.sel .wp-swatch { border-color:var(--accent); box-shadow:var(--shadow-hover); }
.wp-item:hover .wp-swatch { transform:translateY(-2px); }
.wp-name { font-size:11px; margin-top:6px; color:var(--ink2); }
.wp-item.sel .wp-name { color:var(--accent); }

/* ============ 书签 / 历史 / 设置 ============ */
.screen-page { overflow-y:auto; }
.screen-page .topbar { display:flex; align-items:center; gap:4px; padding:8px 10px 6px; position:sticky; top:0; z-index:5; }
.screen-page .topbar button {
  border:none; background:transparent; color:var(--ink); cursor:pointer;
  width:38px; height:38px; border-radius:19px; display:flex; align-items:center; justify-content:center;
}
.screen-page .topbar button svg { width:19px; height:19px; }
.screen-page .topbar h2 { flex:1; text-align:center; font-size:17px; font-weight:600; letter-spacing:-.2px; }
.list { padding:6px 16px 30px; display:flex; flex-direction:column; gap:10px; }
.item {
  border-radius:18px; padding:10px 12px; display:flex; align-items:center; gap:12px;
  background:var(--paper); border:1px solid var(--card-border);
  box-shadow:0 1px 2px rgba(0,0,0,.03);
  transition:transform .15s var(--ease-out), box-shadow .2s var(--ease-out);
}
.item .av {
  width:40px; height:40px; border-radius:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--surface-soft); border:1px solid var(--card-border);
  color:var(--ink); font-size:17px; font-weight:500; font-family:'Outfit';
}
.item .meta { flex:1; min-width:0; }
.item .meta .t { font-size:14px; font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .meta .u { font-size:11.5px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .meta .tm { font-size:11px; color:var(--ink3); margin-top:2px; }
.item .del { border:none; background:transparent; color:var(--ink2); cursor:pointer; display:flex; padding:8px; }
.item .del svg { width:14px; height:14px; }
.empty { display:flex; flex-direction:column; align-items:center; gap:10px; padding:70px 0; color:var(--ink3); font-size:13px; }
.empty .big { color:var(--ink3); opacity:.6; }
.empty .big svg { width:44px; height:44px; }
.empty small { opacity:.8; }
/* 历史搜索 */
.hsearch { margin:4px 16px 12px; border-radius:18px; height:40px; display:flex; align-items:center; padding:0 12px; gap:8px; }
.hsearch .search-ic { width:15px; height:15px; color:var(--ink2); flex-shrink:0; }
.hsearch input { flex:1; border:none; outline:none; background:transparent; font-family:inherit; font-size:13px; color:var(--ink); min-width:0; }
/* 设置 */
.setgroup { margin:18px 6px 8px; font-size:11px; letter-spacing:2px; color:var(--ink3); }
.setgroup:first-child { margin-top:6px; }
.setcard { border-radius:20px; padding:4px 16px; }
.setrow { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:0.5px solid var(--card-border); font-size:14px; }
.setrow:last-child { border-bottom:none; }
.setrow .val { font-size:12.5px; color:var(--ink2); display:flex; align-items:center; gap:8px; }
.setrow .val.ok { color:var(--ok); }
.setrow .val.danger { color:var(--danger); }
.switch {
  width:42px; height:24px; border-radius:12px; flex-shrink:0;
  background:var(--surface-soft); border:1px solid var(--card-border);
  position:relative; cursor:pointer;
  transition:background-color .15s ease, border-color .15s ease;
}
.switch::after {
  content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:var(--ink2);
  transition:transform .22s var(--ease-spring), background-color .15s ease;
}
.switch.on { background:var(--accent); border-color:transparent; }
.switch.on::after { transform:translateX(18px); background:#fff; }

/* 提示条 */
.toast {
  position:absolute; left:50%; bottom:74px; transform:translate(-50%,8px);
  background:var(--surface-strong); color:var(--ink); font-size:12.5px;
  padding:10px 18px; border-radius:12px; z-index:60; opacity:0; pointer-events:none;
  transition:opacity .15s ease, transform .15s ease; white-space:nowrap; box-shadow:var(--shadow);
  border:1px solid var(--card-border);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
}
.toast.show { opacity:1; transform:translate(-50%,0); transition-duration:.25s; transition-timing-function:var(--ease-out); }

/* 列表入场（stagger） */
.stagger > * { animation:rise .42s var(--ease-out) both; animation-delay:calc(var(--i,0) * 40ms); }
@keyframes rise { from { opacity:0; transform:translateY(10px); } }

/* ============ 桌面模式调整 ============ */
#device.desktop .quick-grid { grid-template-columns:repeat(6,1fr); }
#device.desktop .brand .Y { font-size:62px; }
#device.desktop .brand .rest { font-size:44px; }
#device.desktop .nt-inner { padding-top:56px; }
#device.desktop .tabgrid { grid-template-columns:repeat(4,1fr); }
#device.desktop .menu-grid { grid-template-columns:repeat(8,1fr); }

/* ============ 无障碍：减弱动效 ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>

<script>
/* ================= 线性图标 ================= */
const IC = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  x: IC('<path d="M6 6l12 12M18 6L6 18"/>'),
  reload: IC('<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v4h-4"/>'),
  bookmark: IC('<path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4.2L6 21V4.5a1 1 0 0 1 1-1z"/>'),
  clock: IC('<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.4 2"/>'),
  sun: IC('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/>'),
  moon: IC('<path d="M20 14.5A8.2 8.2 0 1 1 9.5 4 6.6 6.6 0 0 0 20 14.5z"/>'),
};

/* ================= 数据 ================= */
const POEMS = [
  ['人生若只如初见，何事秋风悲画扇','纳兰性德','木兰花·拟古决绝词柬友'],
  ['众里寻他千百度，蓦然回首，那人却在，灯火阑珊处','辛弃疾','青玉案·元夕'],
  ['但愿人长久，千里共婵娟','苏轼','水调歌头'],
  ['床前明月光，疑是地上霜。举头望明月，低头思故乡','李白','静夜思'],
  ['行到水穷处，坐看云起时','王维','终南别业'],
  ['落霞与孤鹜齐飞，秋水共长天一色','王勃','滕王阁序'],
  ['大鹏一日同风起，扶摇直上九万里','李白','上李邕'],
  ['春风得意马蹄疾，一日看尽长安花','孟郊','登科后'],
  ['醉后不知天在水，满船清梦压星河','唐珙','题龙阳县青草湖'],
  ['人生自是有情痴，此恨不关风与月','欧阳修','玉楼春'],
  ['我见青山多妩媚，料青山见我应如是','辛弃疾','贺新郎'],
  ['桃李春风一杯酒，江湖夜雨十年灯','黄庭坚','寄黄几复'],
];
const QUICK_DEFAULTS = []; // 首页默认不预置快捷链接，仅保留手动添加入口
const SAMPLE_BOOKMARKS = [
  ['知乎 - 有问题，就会有答案','https://www.zhihu.com'],
  ['GitHub','https://github.com'],
  ['哔哩哔哩 (゜-゜)つロ 干杯~','https://www.bilibili.com'],
];
const SAMPLE_HISTORY = [
  ['哔哩哔哩 (゜-゜)つロ 干杯~','https://www.bilibili.com/video/BV1GJ411x7h7', 2],
  ['知乎 - 有问题，就会有答案','https://www.zhihu.com/question/299538341', 45],
  ['GitHub','https://github.com/qiqi1200/search', 130],
  ['百度一下，你就知道','https://www.baidu.com', 300],
  ['Flutter 官方文档','https://docs.flutter.dev', 1500],
  ['Yanler 博客','https://blog.260607.best', 2900],
];
const LS = {
  quick:'yanler_preview_quick', bm:'yanler_preview_bm', hs:'yanler_preview_hs',
};

let quick = load(LS.quick, QUICK_DEFAULTS.map(q=>({title:q[0],url:q[1],c:q[2]})));
let bookmarks = load(LS.bm, SAMPLE_BOOKMARKS.map(b=>({title:b[0],url:b[1]})));
let history = load(LS.hs, SAMPLE_HISTORY.map(h=>({title:h[0],url:h[1],min:h[2]})));
function load(k, def){ try{ const v=JSON.parse(localStorage.getItem(k)); return v||def; }catch(e){ return def; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

/* ================= 全局状态 ================= */
let current = 'newtab';       // newtab | page | bookmarks | history | settings
let theme = 'light';
let isDesktop = false;
let tabs = [{id:1, title:'新标签页', url:'', active:true}];
let activeTab = 0;
let poemIdx = 0, charIdx = 0, phase = 'brand';
let loadTimer = null;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE_OUT = 'cubic-bezier(.16,1,.3,1)';

const $ = id => document.getElementById(id);

/* ================= 打字机（节奏不变：logo 4s → 打字 60ms/字 → 停留 2s） ================= */
function startTypewriter() {
  poemIdx = (poemIdx + 1) % POEMS.length;
  charIdx = 0;
  const [text, author, title] = POEMS[poemIdx];
  $('brandHolder').style.opacity = 0;
  $('brandHolder').style.transform = 'translateY(-6px)';
  $('poemHolder').style.opacity = 1;
  $('poemHolder').style.transform = 'none';
  phase = 'typing';
  const tick = setInterval(() => {
    if (phase !== 'typing') { clearInterval(tick); return; }
    charIdx++;
    $('poemText').innerHTML = text.slice(0, charIdx) + (charIdx < text.length ? '<span class="cursor"></span>' : '');
    if (charIdx >= text.length) {
      clearInterval(tick);
      $('poemAuthor').textContent = `—— ${author} 《${title}》`;
      $('poemAuthor').style.opacity = 1;
      setTimeout(backToBrand, 2000);
    }
  }, 60);
}
function backToBrand() {
  phase = 'brand';
  $('brandHolder').style.opacity = 1;
  $('brandHolder').style.transform = 'none';
  $('poemHolder').style.opacity = 0;
  $('poemHolder').style.transform = 'translateY(6px)';
  $('poemAuthor').style.opacity = 0;
  $('poemText').textContent = '';
  setTimeout(startTypewriter, 4000);
}
setTimeout(startTypewriter, 4000);

/* ================= 快捷链接 ================= */
function renderQuick() {
  const g = $('quickGrid'); g.innerHTML = '';
  quick.forEach((q, i) => {
    const t = document.createElement('div');
    t.className = 'quick-tile press';
    t.style.setProperty('--i', Math.min(i, 8));
    t.innerHTML = `<div class="quick-avatar"><span>${q.title[0].toUpperCase()}</span><span class="x" title="移除">✕</span></div>
      <div class="quick-name">${q.title}</div>`;
    t.onclick = () => openUrl(q.title, q.url);
    t.oncontextmenu = e => { e.preventDefault(); removeQuick(i); };
    t.querySelector('.x').onclick = e => { e.stopPropagation(); removeQuick(i); };
    g.appendChild(t);
  });
  const add = document.createElement('div');
  add.className = 'quick-tile press';
  add.style.setProperty('--i', Math.min(quick.length, 8));
  add.innerHTML = `<div class="quick-avatar quick-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5v13M5.5 12h13"/></svg></div><div class="quick-name">添加</div>`;
  add.onclick = addQuick;
  g.appendChild(add);
}
function removeQuick(i) {
  if (!confirm(`移除「${quick[i].title}」？`)) return;
  quick.splice(i, 1); save(LS.quick, quick); renderQuick();
}
function addQuick() {
  const title = prompt('名称：'); if (!title) return;
  const url = prompt('网址（如 example.com）：'); if (!url) return;
  quick.push({title, url: url.includes('.') ? 'https://'+url : url, c: (quick.length % 6) + 1});
  save(LS.quick, quick); renderQuick(); toast('已添加快捷链接');
}

/* ================= 页面导航（模拟网页） ================= */
function openUrl(title, url) {
  tabs[activeTab] = { ...tabs[activeTab], title, url };
  renderTabs();
  $('addressInput').value = url;
  $('fakePage').innerHTML = `
    <div class="sitebar"><div><h2>${title}</h2><small>${url}</small></div></div>
    <p>这是「${title}」的模拟页面 —— 在真实 App 中此处为 WebView 内容。液态玻璃在平台视图上方的退化效果，可以通过地址栏与底部栏观察。</p>
    <div class="card-blocks"><div></div><div></div><div></div></div>
    <p style="margin-top:16px">地址栏支持：输入新地址后回车 / 点击刷新按钮，进度条会模拟加载动画。后退按钮在加载完成后可用，可回到新标签页。</p>`;
  showScreen('page');
  simulateLoad();
}
function simulateLoad() {
  $('btnBack').disabled = false; $('btnFwd').disabled = false;
  const bar = $('progressBar');
  let p = 0;
  clearInterval(loadTimer);
  bar.style.opacity = 1;
  loadTimer = setTimeout(() => {
    loadTimer = setInterval(() => {
      p += Math.random() * 0.22 + 0.06;
      if (p >= 1) {
        p = 1;
        clearInterval(loadTimer);
        $('addrAction').innerHTML = ICONS.reload;
        setTimeout(() => {
          bar.style.opacity = 0;
          setTimeout(() => { bar.style.transform = 'scaleX(0)'; }, 320);
        }, 250);
      }
      bar.style.transform = `scaleX(${p})`;
    }, 150);
  }, 200);
}
function toggleReload() {
  const btn = $('addrAction');
  const loading = btn.dataset.loading === '1';
  if (loading) {
    btn.dataset.loading = '0';
    btn.innerHTML = ICONS.reload;
    clearInterval(loadTimer);
    $('progressBar').style.transform = 'scaleX(0)';
  } else {
    btn.dataset.loading = '1';
    btn.innerHTML = ICONS.x;
    simulateLoad();
  }
}
$('addressInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { openUrl($('addressInput').value, $('addressInput').value); }
});
function doSearch() {
  const q = $('searchInput').value.trim();
  if (!q) return;
  openUrl(`搜索：${q}`, `https://www.bing.com/search?q=${encodeURIComponent(q)}`);
}

/* ================= 底部栏 / 面板 ================= */
function goBack() {
  if (current === 'page') { showScreen('newtab', true); $('btnBack').disabled = true; return; }
  showScreen('newtab', true);
}
function goForward() { toast('没有可前进的页面'); }
function toggleAI() { toast('AI 代理模式已开启'); }
function openSheet(id) { $(id + 'Mask').classList.add('show'); }
function closeSheet() { document.querySelectorAll('.sheet-mask').forEach(m => m.classList.remove('show')); }

/* 面板拖拽收起 */
function attachSheetDrag(mask) {
  const sheet = mask.querySelector('.sheet');
  const zone = sheet.querySelector('.sheet-grab');
  let startY = 0, dy = 0, dragging = false, lastY = 0, lastT = 0, vel = 0;
  zone.addEventListener('pointerdown', e => {
    dragging = true; dy = 0;
    startY = e.clientY; lastY = startY; lastT = performance.now(); vel = 0;
    sheet.style.transition = 'none';
    zone.setPointerCapture(e.pointerId);
  });
  zone.addEventListener('pointermove', e => {
    if (!dragging) return;
    const y = e.clientY;
    dy = Math.max(0, y - startY);
    const now = performance.now();
    vel = (y - lastY) / Math.max(1, now - lastT);
    lastY = y; lastT = now;
    sheet.style.transform = `translateY(${dy}px)`;
  });
  const up = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (dy > 90 || vel > 0.45) closeSheet();
  };
  zone.addEventListener('pointerup', up);
  zone.addEventListener('pointercancel', up);
}

/* 屏幕转场（方向感） */
function showScreen(name, back) {
  closeSheet();
  const from = document.querySelector('.screen.active');
  const to = $(name);
  if (from === to) { current = name; renderIfNeeded(name); return; }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  to.classList.add('active');
  if (!reducedMotion) {
    const dx = back ? -24 : 24;
    to.animate(
      [{ opacity: 0, transform: `translateX(${dx}px)` }, { opacity: 1, transform: 'none' }],
      { duration: 400, easing: EASE_OUT }
    );
    if (from) from.animate(
      [{ opacity: 1, transform: 'none' }, { opacity: .4, transform: `translateX(${-dx / 3}px)` }],
      { duration: 400, easing: EASE_OUT }
    );
  }
  current = name;
  renderIfNeeded(name);
}
function renderIfNeeded(name) {
  if (name === 'bookmarks') renderBookmarks();
  if (name === 'history') { $('historySearch').value = ''; renderHistory(); }
  if (name === 'settings') renderSettingsData();
}

/* ================= 标签页（FLIP 补位动画） ================= */
function renderTabs() {
  const g = $('tabGrid');
  const before = new Map([...g.children].map(el => [el.dataset.key, el.getBoundingClientRect()]));
  $('tabCount').textContent = tabs.length;
  $('tabsCount').textContent = tabs.length;
  g.innerHTML = '';
  tabs.forEach((t, i) => {
    const host = t.url ? t.url.replace(/^https?:\/\//,'').split('/')[0] : '';
    const letter = (host || t.title || '?')[0].toUpperCase();
    const card = document.createElement('div');
    card.className = 'card tabcard' + (t.active ? ' active' : '');
    card.dataset.key = t.id;
    card.innerHTML = `<div class="thumb"><div class="letter">${letter}</div></div>
      <div class="ttl"><span>${t.title}</span><button onclick="event.stopPropagation();closeTab(${i})">${ICONS.x}</button></div>`;
    card.onclick = () => { activateTab(i); closeSheet(); };
    g.appendChild(card);
  });
  if (reducedMotion) return;
  [...g.children].forEach(el => {
    const old = before.get(el.dataset.key);
    if (!old) {
      el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
        { duration: 300, easing: EASE_OUT });
      return;
    }
    const now = el.getBoundingClientRect();
    const dx = old.left - now.left, dy = old.top - now.top;
    if (dx || dy) el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }],
      { duration: 300, easing: EASE_OUT });
  });
}
function addTab() {
  tabs.push({id: Date.now(), title:'新标签页', url:'', active:false});
  activateTab(tabs.length - 1); renderTabs(); closeSheet(); showScreen('newtab');
}
function activateTab(i) {
  tabs.forEach((t,idx)=>t.active = idx===i);
  activeTab = i;
  renderTabs();
  if (tabs[i].url) showScreen('page'); else showScreen('newtab');
}
function closeTab(i) {
  const wasActive = tabs[i] && tabs[i].active;
  const grid = $('tabGrid');
  const el = grid.children[i];
  const finish = () => {
    tabs.splice(i, 1);
    if (!tabs.length) tabs.push({id:1,title:'新标签页',url:'',active:true});
    if (wasActive) {
      activeTab = Math.min(i, tabs.length - 1);
      tabs.forEach((t, idx) => t.active = idx === activeTab);
    }
    renderTabs();
  };
  if (el && !reducedMotion) {
    el.animate(
      [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.9)' }],
      { duration: 250, easing: EASE_OUT, fill: 'forwards' }
    ).onfinish = finish;
  } else finish();
}
function closeAllTabs() {
  if (!confirm('关闭全部标签页？')) return;
  tabs = [{id:1,title:'新标签页',url:'',active:true}]; activeTab = 0; renderTabs(); closeSheet(); showScreen('newtab');
}

/* ================= 书签 ================= */
function renderBookmarks() {
  const l = $('bookmarkList');
  l.innerHTML = '';
  if (!bookmarks.length) {
    l.innerHTML = `<div class="empty"><span class="big">${ICONS.bookmark}</span>还没有书签<br><small>在浏览网页时从菜单收藏即可</small></div>`;
    return;
  }
  bookmarks.forEach((b, i) => {
    const it = document.createElement('div');
    it.className = 'item press';
    it.style.setProperty('--i', Math.min(i, 8));
    const host = b.url.replace(/^https?:\/\//,'').split('/')[0];
    it.innerHTML = `<div class="av">${(host||b.title||'?')[0].toUpperCase()}</div>
      <div class="meta"><div class="t">${b.title}</div><div class="u">${b.url}</div></div>
      <button class="del" onclick="delBookmark(${i})">${ICONS.x}</button>`;
    it.onclick = () => openUrl(b.title, b.url);
    l.appendChild(it);
  });
  $('dataBm').textContent = bookmarks.length + ' 个';
}
function delBookmark(i) { bookmarks.splice(i,1); save(LS.bm, bookmarks); renderBookmarks(); }
function clearBookmarks() { if (confirm('清空全部书签？')) { bookmarks=[]; save(LS.bm, bookmarks); renderBookmarks(); } }
function addBookmark() {
  const t = tabs[activeTab];
  if (!t.url) { toast('当前页不在浏览状态'); return; }
  bookmarks.unshift({title:t.title, url:t.url}); save(LS.bm, bookmarks);
  closeSheet(); toast('已收藏到书签');
}

/* ================= 历史 ================= */
function relTime(min) {
  if (min < 1) return '刚刚';
  if (min < 60) return min + ' 分钟前';
  if (min < 1440) return Math.floor(min/60) + ' 小时前';
  if (min < 10080) return Math.floor(min/1440) + ' 天前';
  const d = new Date(); d.setMinutes(d.getMinutes()-min);
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function renderHistory() {
  const q = ($('historySearch').value || '').toLowerCase();
  const list = history.filter(h => !q || h.title.toLowerCase().includes(q) || h.url.toLowerCase().includes(q));
  const l = $('historyList'); l.innerHTML = '';
  if (!list.length) {
    l.innerHTML = `<div class="empty"><span class="big">${ICONS.clock}</span>${q?'没有匹配的结果':'暂无历史记录'}</div>`;
    return;
  }
  list.forEach((h, i) => {
    const orig = history.indexOf(h);
    const it = document.createElement('div');
    it.className = 'item press';
    it.style.setProperty('--i', Math.min(i, 8));
    const host = h.url.replace(/^https?:\/\//,'').split('/')[0];
    it.innerHTML = `<div class="av">${(host||h.title||'?')[0].toUpperCase()}</div>
      <div class="meta"><div class="t">${h.title}</div><div class="u">${h.url}</div><div class="tm">${relTime(h.min)}</div></div>
      <button class="del" onclick="delHistory(${orig})">${ICONS.x}</button>`;
    it.onclick = () => openUrl(h.title, h.url);
    l.appendChild(it);
  });
  $('dataHs').textContent = history.length + ' 条';
}
function delHistory(i) { history.splice(i,1); save(LS.hs, history); renderHistory(); }
function clearHistory() { if (confirm('清空全部历史？')) { history=[]; save(LS.hs, history); renderHistory(); } }
function clearAllData() {
  if (!confirm('清除所有浏览数据（历史/书签/快捷链接）？')) return;
  bookmarks=[]; history=[]; quick=[]; save(LS.bm,bookmarks); save(LS.hs,history); save(LS.quick,quick);
  renderQuick(); renderBookmarks(); renderHistory(); renderSettingsData(); toast('数据已清除');
}

/* ================= 壁纸 ================= */
const WALLPAPERS = {
  default:{name:'默认', light:['#F6F4EF','#ECE9E2'], dark:['#131417','#191B1F']},
  aurora:{name:'极光', light:['#DCEBFF','#E8DDF7','#F7DCE8'], dark:['#101828','#1A1633','#2A1630']},
  dusk:{name:'暮色', light:['#FFE9D6','#FFD6D6','#E8D5F7'], dark:['#2A1712','#2E1420','#221433']},
  ocean:{name:'深海', light:['#D6F2F0','#D6E8F7','#E0DCF7'], dark:['#0E1F24','#10202E','#161B30']},
  forest:{name:'山野', light:['#E3F2E0','#E0EDE9','#E8E2D6'], dark:['#101D16','#12201C','#1A1C12']},
  sakura:{name:'樱粉', light:['#FFF0F3','#FDE8F0','#F5EBFA'], dark:['#241820','#2A1722','#231A2B']},
  paper:{name:'宣纸', light:['#F7F3E8','#F3EEE2','#EFEAE0'], dark:['#1D1B16','#22201A','#26231C']},
};
let wallpaper = localStorage.getItem('yanler_preview_wp') || 'default';
function applyWallpaper(id) {
  wallpaper = id;
  const w = WALLPAPERS[id] || WALLPAPERS.default;
  const cols = document.documentElement.dataset.theme === 'dark' ? w.dark : w.light;
  document.getElementById('newtab').style.background = 'linear-gradient(180deg,' + cols.join(',') + ')';
  document.getElementById('wallpaperVal').textContent = w.name;
  localStorage.setItem('yanler_preview_wp', id);
  if ($('wpMask').classList.contains('show')) renderWallpaperGrid();
}
function renderWallpaperGrid() {
  const colsNow = document.documentElement.dataset.theme === 'dark';
  $('wpGrid').innerHTML = Object.entries(WALLPAPERS).map(([id, w]) => {
    const cols = colsNow ? w.dark : w.light;
    const sel = wallpaper === id;
    return `<div class="wp-item press${sel ? ' sel' : ''}" onclick="applyWallpaper('${id}');closeSheet()">
      <div class="wp-swatch" style="background:linear-gradient(135deg,${cols.join(',')})"></div>
      <div class="wp-name">${w.name}</div></div>`;
  }).join('');
}
function openWallpaperSheet() {
  renderWallpaperGrid();
  openSheet('wp');
}

/* ================= 设置 / 主题 ================= */
function renderSettingsData() {
  $('dataBm').textContent = bookmarks.length + ' 个';
  $('dataHs').textContent = history.length + ' 条';
}
function toggleSw(el, name) {
  el.classList.toggle('on');
  const on = el.classList.contains('on');
  el.dataset.on = on ? '1' : '0';
  toast((name||'选项') + (on ? ' 已开启' : ' 已关闭'));
}
function toggleThemeFromSwitch(el) {
  const isDark = document.documentElement.dataset.theme === 'dark';
  toggleTheme(!isDark);
  el.classList.toggle('on', !isDark);
  el.dataset.on = !isDark ? '1' : '0';
}
function toggleTheme(force) {
  theme = force !== undefined ? (force ? 'dark' : 'light') : (theme === 'light' ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
  // 菜单第一项：主题图标 + 文案（图标指向点击后的目标模式）
  const item = document.querySelectorAll('.menu-item')[0];
  item.querySelector('.ic').innerHTML = theme === 'light' ? ICONS.moon : ICONS.sun;
  item.querySelector('.lb').textContent = theme === 'light' ? '深色' : '浅色';
  // 外观卡片里的深色模式开关同步
  const darkRow = [...document.querySelectorAll('.setrow')].find(r => r.querySelector('span') && r.querySelector('span').textContent === '深色模式');
  const sw = darkRow && darkRow.querySelector('.switch');
  if (sw) { sw.classList.toggle('on', theme === 'dark'); sw.dataset.on = theme === 'dark' ? '1' : '0'; }
  // 壁纸跟随主题刷新
  applyWallpaper(wallpaper);
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ================= 设备切换 / 重置 ================= */
$('btn-phone').onclick = () => {
  isDesktop = false; $('device').classList.remove('desktop');
  $('btn-phone').classList.add('active'); $('btn-desktop').classList.remove('active');
};
$('btn-desktop').onclick = () => {
  isDesktop = true; $('device').classList.add('desktop');
  $('btn-desktop').classList.add('active'); $('btn-phone').classList.remove('active');
};
$('btn-theme').onclick = () => { toggleTheme(); toast(theme==='dark' ? '已切换深色' : '已切换浅色'); };
$('btn-reset').onclick = () => {
  if (!confirm('重置所有预览数据？')) return;
  localStorage.removeItem(LS.quick); localStorage.removeItem(LS.bm); localStorage.removeItem(LS.hs);
  location.reload();
};

/* ================= 初始化 ================= */
document.querySelectorAll('.sheet-mask').forEach(attachSheetDrag);
renderQuick();
renderTabs();
renderSettingsData();
applyWallpaper(wallpaper);
</script>
