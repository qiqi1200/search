name: yanler_browser
description: Yanler - 极简无广告浏览器，丝滑高级UI，内置AI助手
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # WebView
  flutter_inappwebview: ^6.1.5
  
  # 状态管理
  provider: ^6.1.2
  
  # 本地存储
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  
  # 网络
  http: ^1.2.2
  
  # 工具
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.5.1

  # 应用内更新
  package_info_plus: ^8.0.0
  open_filex: ^4.4.0
  
  # 加密
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  fonts:
    # Yanler 品牌英文字体 — Google Fonts Outfit（几何现代风，w200-w700 实例化）
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    # 诗词展示字体 — Adobe 思源宋体（子集化，仅含诗词数据库字符，~144KB）
    - family: SourceHanSerifSC
      fonts:
        - asset: assets/fonts/SourceHanSerifSC-Regular.otf
          weight: 400
