name: yanler_browser
description: Yanler - 极简无广告浏览器，丝滑高级AI，内置AI助手
publish_to: 'none'
version: 1.4.6+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # WebView
  flutter_inappwebview: ^6.1.5

  # 状态管理
  provider: ^6.1.2

  # 本地存储
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # 网络
  http: ^1.2.2

  # 工具
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  package_info_plus: ^8.3.1
  open_filex: ^4.7.0

  # 加密
  flutter_secure_storage: ^9.2.4

  # 图片选择（自定义壁纸）
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icon/icon.png
    - assets/icon/icon_foreground.png

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Light.ttf
        - asset: assets/fonts/Outfit-ExtraLight.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
        - asset: assets/fonts/Outfit-SemiBold.ttf
        - asset: assets/fonts/Outfit-Bold.ttf
    - family: SourceHanSerifSC
      fonts:
        - asset: assets/fonts/SourceHanSerifSC-Regular.otf
