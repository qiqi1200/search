name: Auto Release APK

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: yanler_browser

jobs:
  build_apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    env:
      YANLER_MAVEN_MIRROR: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      # Gradle 缓存：避免每次构建重新下载依赖（节省 2-4 分钟）
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('yanler_browser/android/**/*.gradle*', 'yanler_browser/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 修复版本号不匹配：确保 pubspec.yaml 版本与 Release 标签严格一致
      - name: Sync version from tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
            VER="${RAW#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi
          # 提取当前 build 号（+ 后面的数字）
          FULL_VER=$(grep -oP 'version:\s*\K.*' pubspec.yaml | tr -d ' ')
          BUILD_NUM="${FULL_VER##*+}"
          sed -i "s/^version: .*/version: ${VER}+${BUILD_NUM}/" pubspec.yaml
          echo "✅ pubspec.yaml version synced to ${VER}+${BUILD_NUM}"

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/key.jks
            echo "storeFile=../key.jks" > android/key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "::notice::Release signing configured"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 密钥，本次使用 debug 签名（覆盖安装正式签名版将失败）。请在仓库 Settings → Secrets 配置后重打 tag。"
          fi

      - name: Verify
        run: flutter analyze

      - name: Build universal APK
        run: flutter build apk --release

      # 计算 Release 标签与版本号（push tag / 手动创建 tag / 已有 Release）
      - name: Compute release tag & version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
            VER="${RAW#v}"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git tag "v$VER" 2>/dev/null || true
            git push origin "v$VER" 2>/dev/null || true
            TAG="v$VER"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stage APK assets
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk "release_assets/Yanler-${VER}.apk"

      # 自动创建/更新 Release 并上传通用 APK（应用内更新检查 latest 即取此包）
      - name: Create / Update Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Yanler ${{ steps.ver.outputs.tag }}
          body: |
            自动构建发布 — Yanler ${{ steps.ver.outputs.tag }}

            - 通用 APK（所有 ABI）：`Yanler-${{ steps.ver.outputs.ver }}.apk`
            - 应用内更新会自动检测并下载本包
          files: yanler_browser/release_assets/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false

      # 自动更新 version.json → 推送到 main → jsDelivr CDN 刷新
      # 应用内更新通过 CDN 读取此文件检测新版本（国内无需翻墙）
      # 注意：必须在 checkout main 之后写文件，否则 git checkout 会覆盖刚写入的新内容
      #（旧版 bug：`git checkout ${{ github.sha }} -- version.json` 把新 version.json
      #  还原成 tag 提交里的旧文件，导致 main 上永远是旧版本号，应用内更新检测不到新版本。）
      - name: Update & commit version.json to main
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          TAG="${{ steps.ver.outputs.tag }}"
          APK_URL="https://github.com/qiqi1200/search/releases/download/${TAG}/Yanler-${VER}.apk"
          BUILD=$(grep -oP 'version:.*\+\K[0-9]+' pubspec.yaml || echo "1")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cat > version.json << EOF
          {
            "version": "${VER}",
            "build": ${BUILD},
            "url": "${APK_URL}",
            "notes": "Yanler ${TAG} 自动发布"
          }
          EOF
          git add version.json
          git diff --cached --quiet && echo "✅ version.json already up-to-date" || (git commit -m "chore: auto-update version.json to ${VER}" && git push origin main)

      # 强制刷新 jsDelivr @main 缓存：不 purge 的话 CDN 会滞后数小时
      #（实测卡在旧版本），应用内更新检测会拿到旧版本号。发布后立即清理。
      - name: Purge jsDelivr cache for version.json
        run: |
          curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/qiqi1200/search@main/yanler_browser/version.json" || echo "jsDelivr purge 失败（不影响发布，CDN 会自然刷新）"

  # 可选：Windows 构建发布
  build_windows:
    name: Build & Upload Windows
    runs-on: windows-2022
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Yanler-Windows-x64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: yanler_browser/Yanler-Windows-x64.zip
          fail_on_unmatched_files: false
