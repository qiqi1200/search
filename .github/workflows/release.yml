name: Auto Release APK

on:
  push:
    tags: ['v*']
  # 注意：不再监听 release:published——softprops 发布 Release 会再触发一次本工作流，
  # 导致同一 tag 重复构建并覆盖同一 URL 的 APK（内容变动 → 镜像缓存旧包，应用内
  # 更新竞速可能装到旧版本）。tag 推送即足够，一次发布一次构建。
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: yanler_browser

jobs:
  build_apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    env:
      YANLER_MAVEN_MIRROR: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      # Gradle 缓存：避免每次构建重新下载依赖（节省 2-4 分钟）
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('yanler_browser/android/**/*.gradle*', 'yanler_browser/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 版本号唯一来源 = tag。禁止沿用源码里旧的构建号——曾导致多版本
      # versionCode 都是 2（pubspec 长时间停在 +2），系统安装器把新包判定为
      # 「同版本/降级」，出现「提示新版本、装完还是老的/装不上」。
      # versionCode = 主*1e6 + 次*1e3 + 修订（单调递增，随 tag 只增不减）。
      - name: Sync version from tag
        id: sync
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
            VER="${RAW#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi
          # 从 tag 推导单调递增 versionCode（禁止读取 pubspec 旧构建号）
          MAJOR="${VER%%.*}"
          MINOR_TAIL="${VER#*.}"
          MINOR="${MINOR_TAIL%%.*}"
          PATCH="${VER##*.}"
          VCODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          sed -i "s/^version: .*/version: ${VER}+${VCODE}/" pubspec.yaml
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${VCODE}" >> "$GITHUB_OUTPUT"
          echo "✅ pubspec.yaml version = ${VER}+${VCODE}（versionName=${VER} / versionCode=${VCODE}）"

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/key.jks
            echo "storeFile=../key.jks" > android/key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "::notice::Release signing configured"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 密钥，本次使用 debug 签名（覆盖安装正式签名版将失败）。请在仓库 Settings → Secrets 配置后重打 tag。"
          fi

      - name: Verify
        run: flutter analyze

      - name: Build universal APK
        run: flutter build apk --release

      # 计算 Release 标签与版本号（push tag / 手动创建 tag / 已有 Release）
      - name: Compute release tag & version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
            VER="${RAW#v}"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git tag "v$VER" 2>/dev/null || true
            git push origin "v$VER" 2>/dev/null || true
            TAG="v$VER"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stage APK assets
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk "release_assets/Yanler-${VER}.apk"

      - name: Compute APK SHA-256
        id: apk_sha
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          SHA=$(sha256sum "release_assets/Yanler-${VER}.apk" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "✅ APK SHA-256: ${SHA}"

      # 防重发布：同一 tag 的 Release 已存在则直接失败。复用 Release URL 会让
      # ghfast/gh-proxy 等镜像命中旧包缓存 → 「提示新版本、装完还是老的」。
      # 每次发布必须升版本号（新 tag = 新 URL = 镜像无缓存）。
      - name: 'Guard: refuse re-releasing existing tag'
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh api "repos/${{ github.repository }}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} 已存在。请递增版本号（pubspec.yaml + 新 tag）后重试，禁止重复发布同版本，否则镜像缓存旧包导致更新装错。"
            exit 1
          fi
          echo "✅ ${TAG} 尚未发布，继续"

      # 自动创建/更新 Release 并上传通用 APK（应用内更新检查 latest 即取此包）
      - name: Create / Update Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Yanler ${{ steps.ver.outputs.tag }}
          body: |
            自动构建发布 — Yanler ${{ steps.ver.outputs.tag }}

            - 通用 APK（所有 ABI）：`Yanler-${{ steps.ver.outputs.ver }}.apk`
            - 应用内更新会自动检测并下载本包
          files: yanler_browser/release_assets/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false

      # 发布后自检（强制）：重新下载刚上传的 asset（走 GitHub API，非缓存），
      # 用 aapt 解析内部 versionName/versionCode，与 tag 断言一致；
      # 不一致则 workflow 直接 fail，永久杜绝「tag 是新的、包是旧的/低位版本」。
      - name: 'Post-release self-check (aapt version audit)'
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          TAG="${{ steps.ver.outputs.tag }}"
          EXPECT_NAME="${VER}"
          EXPECT_CODE="${{ steps.sync.outputs.versionCode }}"
          echo "🔎 期望 versionName=${EXPECT_NAME} versionCode=${EXPECT_CODE}"
          gh release download "${TAG}" -R "${{ github.repository }}" -p "Yanler-${VER}.apk" -D /tmp/audit --clobber
          APK="/tmp/audit/Yanler-${VER}.apk"
          AAPT=$(find "$ANDROID_HOME" -name aapt -path '*build-tools*' 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then AAPT=$(command -v aapt || true); fi
          if [ -z "$AAPT" ]; then echo "::error::找不到 aapt，无法自检版本"; exit 1; fi
          BADGING=$("$AAPT" dump badging "$APK" 2>/dev/null | grep -m1 '^package:')
          ACTUAL_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+" || true)
          ACTUAL_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" || true)
          echo "✅ 实际 versionName=${ACTUAL_NAME} versionCode=${ACTUAL_CODE}（size=$(stat -c%s "$APK")）"
          if [ -z "$ACTUAL_CODE" ] || [ -z "$ACTUAL_NAME" ] || \
             [ "$ACTUAL_CODE" != "$EXPECT_CODE" ] || [ "$ACTUAL_NAME" != "$EXPECT_NAME" ]; then
            echo "::error::发布自检失败：asset 内部版本与 tag 不一致！"
            echo "::error::期望 versionName=${EXPECT_NAME} versionCode=${EXPECT_CODE}；实际 versionName=${ACTUAL_NAME} versionCode=${ACTUAL_CODE}"
            exit 1
          fi
          echo "🎉 发布自检通过：asset 内部版本与 tag 严格一致"

      # 自动更新 version.json → 推送到 main → jsDelivr CDN 刷新
      # 应用内更新通过 CDN 读取此文件检测新版本（国内无需翻墙）
      # 注意：必须在 checkout main 之后写文件，否则 git checkout 会覆盖刚写入的新内容
      #（旧版 bug：`git checkout ${{ github.sha }} -- version.json` 把新 version.json
      #  还原成 tag 提交里的旧文件，导致 main 上永远是旧版本号，应用内更新检测不到新版本。）
      - name: Update & commit version.json to main
        env:
          VCODE: ${{ steps.sync.outputs.versionCode }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          TAG="${{ steps.ver.outputs.tag }}"
          APK_URL="https://github.com/qiqi1200/search/releases/download/${TAG}/Yanler-${VER}.apk"
          APK_SIZE=$(stat -c%s "release_assets/Yanler-${VER}.apk")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cat > version.json << EOF
          {
            "version": "${VER}",
            "build": ${VCODE},
            "versionCode": ${VCODE},
            "size": ${APK_SIZE},
            "url": "${APK_URL}",
            "sha256": "${{ steps.apk_sha.outputs.sha256 }}",
            "notes": "Yanler ${TAG} 自动发布"
          }
          EOF
          git add version.json
          git diff --cached --quiet && echo "✅ version.json already up-to-date" || (git commit -m "chore: auto-update version.json to ${VER}" && git push origin main)

      # 强制刷新 jsDelivr @main 缓存：不 purge 的话 CDN 会滞后数小时
      #（实测卡在旧版本），应用内更新检测会拿到旧版本号。发布后立即清理。
      - name: Purge jsDelivr cache for version.json
        run: |
          curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/qiqi1200/search@main/yanler_browser/version.json" || echo "jsDelivr purge 失败（不影响发布，CDN 会自然刷新）"

  # 可选：Windows 构建发布
  build_windows:
    name: Build & Upload Windows
    runs-on: windows-2022
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Yanler-Windows-x64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: yanler_browser/Yanler-Windows-x64.zip
          fail_on_unmatched_files: false
