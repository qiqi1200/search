name: yanler_browser
description: Yanler - 极简无广告浏览器，丝滑高级UI，内置AI助手
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # WebView
  flutter_inappwebview: ^6.1.5
  
  # 状态管理
  provider: ^6.1.2
  
  # 本地存储
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  
  # 网络
  http: ^1.2.2
  
  # 工具
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  
  # 加密
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/fonts/
